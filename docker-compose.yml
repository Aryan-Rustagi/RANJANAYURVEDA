services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  client:
    build:
      context: ./client/RANJANAYURVEDA
      dockerfile: Dockerfile
    container_name: frontend_client
    ports:
      - "3000:80"
    depends_on:
      - server
