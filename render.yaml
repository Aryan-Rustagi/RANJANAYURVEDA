services:
  # 1. Customer API (Node Express Server)
  - type: web
    name: ranjan-customer-api
    runtime: node
    plan: free
    branch: aryan
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  # 2. Admin API (Node Express Server)
  - type: web
    name: ranjan-admin-api
    runtime: node
    plan: free
    branch: aryan
    rootDir: admin-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CLIENT_URL
        sync: false

  # 3. Customer Frontend Portal (Vite React Static Site)
  - type: web
    name: ranjan-customer-ui
    runtime: static
    plan: free
    branch: aryan
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ADMIN_CLIENT_URL
        sync: false

  # 4. Admin Management Portal (Vite React Static Site)
  - type: web
    name: ranjan-admin-ui
    runtime: static
    plan: free
    branch: aryan
    rootDir: admin-client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ADMIN_API_URL
        sync: false
